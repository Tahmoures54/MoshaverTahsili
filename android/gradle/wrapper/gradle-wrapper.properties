# ═══════════════════════════════════════════════════════════════════════
# android/gradle/wrapper/gradle-wrapper.properties
# مشاور هوشمند تحصیلی — سیمرغ
#
# نسخه Gradle عمداً ثابت شده است تا build قابل تکرار باشد.
# Gradle 8.11.1 «آخرین نسخه سازگار با تمام AGPهای 8.x» نیست.
#
# سازگاری مهم برای تنظیمات فعلی پروژه:
# - برای compileSdk = 36، حداقل AGP پشتیبانی‌کننده 8.9.1 است.
# - AGP 8.9.x و 8.10.x حداقل به Gradle 8.11.1 نیاز دارند.
# - AGP 8.11.x حداقل به Gradle 8.13 نیاز دارد.
# - AGP 8.x برای اجرا به JDK 17 نیاز دارد.
#
# قبل از تغییر نسخه، سازگاری Flutter، Kotlin، AGP و Gradle بررسی شود.
# این فایل نسخه AGP، Kotlin، Java یا Android SDK را تعیین نمی‌کند.
# ═══════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────
# ۱. محل ذخیره توزیع استخراج‌شده Gradle
# ───────────────────────────────────────────────────────────────────────

# مقدار پیش‌فرض GRADLE_USER_HOME معمولاً ~/.gradle است.
# با متغیر محیطی GRADLE_USER_HOME می‌توان مسیر پایه را تغییر داد.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists


# ───────────────────────────────────────────────────────────────────────
# ۲. محل ذخیره فایل ZIP دانلودشده
# ───────────────────────────────────────────────────────────────────────

zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists


# ───────────────────────────────────────────────────────────────────────
# ۳. نسخه ثابت Gradle
# ───────────────────────────────────────────────────────────────────────

# توزیع bin برای اجرای build کافی و از all کوچک‌تر است.
# تبدیل bin به all نیازمند تغییر هم‌زمان URL و checksum است.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip


# ───────────────────────────────────────────────────────────────────────
# ۴. بررسی SHA-256 توزیع دانلودشده
# ───────────────────────────────────────────────────────────────────────

# این مقدار مختص gradle-8.11.1-bin.zip است.
#
# منابع رسمی برای تطبیق:
# https://gradle.org/release-checksums/
# https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256
#
# هنگام ارتقای Gradle، URL و checksum باید با هم تغییر کنند.
# برای رفع خطای checksum، اعتبارسنجی را حذف یا غیرفعال نکنید.
distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6

# این بررسی مربوط به ZIP توزیع است، نه gradle-wrapper.jar.
# فایل JAR مربوط به Wrapper نیز باید جداگانه اعتبارسنجی شود.
#
# اعتبارسنجی ZIP هنگام نصب توزیع انجام می‌شود؛ این گزینه تضمین‌کننده
# بررسی دوباره فایل‌های استخراج‌شده در هر اجرای build نیست.
# در CI از cache قابل اعتماد استفاده کنید.


# ───────────────────────────────────────────────────────────────────────
# ۵. تنظیمات شبکه
# ───────────────────────────────────────────────────────────────────────

# timeout عملیات شبکه برحسب میلی‌ثانیه: ۵ دقیقه.
# این مقدار سقف زمانی کل دانلود یا کل build نیست.
# تنظیم بلندتر برای اتصال‌های کند مفید است، اما تضمین رفع قطعی نیست.
networkTimeout=300000

# در Wrapperهای پشتیبانی‌کننده، برای اعتبارسنجی URL در فرایند
# تولید یا به‌روزرسانی Wrapper استفاده می‌شود.
# جایگزین HTTPS، SHA-256 یا اعتبارسنجی gradle-wrapper.jar نیست.
validateDistributionUrl=true


# ───────────────────────────────────────────────────────────────────────
# ۶. نگهداری و عیب‌یابی
# ───────────────────────────────────────────────────────────────────────

# تغییر distributionUrl به‌تنهایی فایل‌های زیر را به‌روزرسانی نمی‌کند:
# - android/gradlew
# - android/gradlew.bat
# - android/gradle/wrapper/gradle-wrapper.jar
#
# برای به‌روزرسانی کامل Wrapper، از پوشه android اجرا کنید:
# ./gradlew wrapper --gradle-version 8.11.1 --distribution-type bin \
#   --gradle-distribution-sha256-sum f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
#
# اگر Wrapper قبلی قدیمی است، فرمان را پس از اجرای Gradle جدید
# بار دیگر اجرا کنید تا اسکریپت‌ها و JAR نیز به‌روزرسانی شوند.
# سپس تغییرات هر چهار فایل Wrapper را بازبینی و ثبت کنید.
#
# بررسی نسخه و JVM اجراکننده:
# ./gradlew --version
#
# تنظیم proxy و اطلاعات احراز هویت متعلق به gradle.properties است؛
# اطلاعات محرمانه را داخل این فایل یا مخزن کد قرار ندهید.
#
# networkTimeout فقط دانلود Gradle توسط Wrapper را پوشش می‌دهد؛
# timeout دانلود وابستگی‌های Maven و Google تنظیم جداگانه دارد.
