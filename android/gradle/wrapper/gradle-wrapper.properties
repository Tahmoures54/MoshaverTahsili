# ═══════════════════════════════════════════════════════════
#  gradle-wrapper.properties – مشاور هوشمند تحصیلی (سیمرغ)
#  مسیر جایگزینی: android/gradle/wrapper/gradle-wrapper.properties
# ═══════════════════════════════════════════════════════════

# محل ذخیره‌ی Gradle — پیش‌فرض: ~/.gradle (GRADLE_USER_HOME)
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# محل ذخیره‌ی zip — پیش‌فرض: ~/.gradle (GRADLE_USER_HOME)
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# نسخه‌ی Gradle — آخرین stable سازگار با AGP 8.x
# اگر AGP رو ارتقا دادید، این نسخه رو هم بررسی کنید.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip

# چک‌سام برای تأیید یکپارچگی فایل دانلودشده (جلوگیری از tampering)
# منبع: https://gradle.org/release-checksums
distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6

# تایم‌اوت دانلود — ۵ دقیقه (300000ms) برای شبکه‌ی ایران مناسب‌تر
networkTimeout=300000

# تأیید URL قبل از دانلود — امنیت اضافی
validateDistributionUrl=true
