// ═══════════════════════════════════════════════════════════
//  settings.gradle – مشاور هوشمند تحصیلی
//  Flutter 3.24.5 | AGP 8.7.0 | Gradle 8.9 | Kotlin 2.0.21
// ═══════════════════════════════════════════════════════════

pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = new File(rootDir, "local.properties")
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
            def path = properties.getProperty("flutter.sdk")
            if (path != null) return path
        }
        def envPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
        if (envPath != null) return envPath
        throw new GradleException(
            "flutter.sdk not set in local.properties and FLUTTER_ROOT is not defined"
        )
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// ── مخازن وابستگی (جایگزین allprojects قدیمی) ──
// بدون این بلوک، Poolakey از JitPack پیدا نمی‌شود!
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Poolakey (Bazaar IAP) فقط در JitPack منتشر شده
        maven { url "https://jitpack.io" }
    }
}

// ── پلاگین‌ها ──
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.0" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
}

rootProject.name = "moshaver_tahsili"
include ":app"

// ── Workaround برای پلاگین‌های قدیمی فلاتر ──
// فقط در یک فایل باشد (اینجا). از build.gradle حذف کنید.
gradle.beforeProject { project ->
    if (project.name == "app") {
        return
    }
    if (!project.ext.has("flutter")) {
        project.ext.flutter = [
            compileSdkVersion: 35,
            minSdkVersion    : 24,
            targetSdkVersion : 35,
            ndkVersion       : "26.1.10909125",
        ]
    }
}
