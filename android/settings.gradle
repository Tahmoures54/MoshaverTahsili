pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = new File(rootDir, 'local.properties')
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
            def path = properties.getProperty('flutter.sdk')
            if (path != null) return path
        }
        def envPath = System.getenv('FLUTTER_ROOT') ?: System.getenv('FLUTTER_HOME')
        if (envPath != null) return envPath
        throw new GradleException('flutter.sdk or FLUTTER_ROOT must be configured')
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
}

include ':app'
