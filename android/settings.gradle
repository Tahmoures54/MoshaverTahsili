pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = new File(rootDir, 'local.properties')
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
            def path = properties.getProperty('flutter.sdk')
            if (path != null) return path
        }
        // Fallback to environment variables for CI/CD environments.
        def envPath = System.getenv('FLUTTER_ROOT') ?: System.getenv('FLUTTER_HOME')
        if (envPath != null) return envPath
        throw new GradleException('flutter.sdk or FLUTTER_ROOT must be configured')
    }()
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    // AGP 8.9.1 supports compileSdk 36 and works with Gradle 8.11.1.
    id 'com.android.application' version '8.9.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Required by the pinned Cafe Bazaar plugin's Poolakey dependency.
        maven { url 'https://jitpack.io' }
    }
}

include ':app'
