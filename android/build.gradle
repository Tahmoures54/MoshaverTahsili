// Root Android Gradle configuration for Simorgh.
// Plugin versions are declared in settings.gradle. Keep project repositories
// here because the Flutter Gradle plugin registers its engine Maven repository.

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
