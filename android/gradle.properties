# ═══════════════════════════════════════════════════════════
#  gradle.properties – مشاور هوشمند تحصیلی (سیمرغ)
#  مسیر جایگزینی: android/gradle.properties
# ═══════════════════════════════════════════════════════════

# ─────────────────────────────────────────────
#  1. JVM Configuration
# ─────────────────────────────────────────────
# حافظه‌ی JVM، GC و اخطارهای OOM
org.gradle.jvmargs=-Xmx3G \
  -XX:MaxMetaspaceSize=1G \
  -XX:+UseG1GC \
  -XX:+HeapDumpOnOutOfMemoryError \
  -XX:HeapDumpPath=${user.home}/.gradle/heap-dumps \
  -Dfile.encoding=UTF-8

# تعداد worker‌های موازی — برای device‌های multi-core
# اگر RAM کمتر از 8GB دارید، ۲ یا ۳ بذارید
org.gradle.workers.max=4

# ─────────────────────────────────────────────
#  2. Build Performance
# ─────────────────────────────────────────────
# Build cache (سرعت build مجدد)
org.gradle.caching=true

# Build موازی (پروژه‌های مستقل همزمان build می‌شوند)
org.gradle.parallel=true

# Configuration cache (Gradle 8.x feature — سرعت بازگشایی شدید)
# اگر plugin‌های ناسازگار دارید، false کنید
org.gradle.configuration-cache=false

# Daemon (همیشه فعال — صریح)
org.gradle.daemon=true

# ─────────────────────────────────────────────
#  3. AndroidX
# ─────────────────────────────────────────────
android.useAndroidX=true

# بدون Jetifier (یعنی dependency legacy ندارید)
android.enableJetifier=false

# R class non-transitive (سرعت build بهتر)
android.nonTransitiveRClass=true

# Resource IDs non-final (بهتر برای Kotlin Android Extensions)
android.nonFinalResIds=true

# ─────────────────────────────────────────────
#  4. Kotlin
# ─────────────────────────────────────────────
# استایل کد Kotlin — official توصیه می‌شود
kotlin.code.style=official

# concurrent coroutines در Kotlin 1.9+
kotlin.incremental=true

# ─────────────────────────────────────────────
#  5. Logging (اختیاری — برای build تمیزتر)
# ─────────────────────────────────────────────
# LIFECYCLE (پیش‌فرض)، INFO، DEBUG، QUIET
org.gradle.logging.level=LIFECYCLE

# ─────────────────────────────────────────────
#  6. Flutter-specific (اختیاری)
# ─────────────────────────────────────────────
# برای Flutter، unique variant name بهتر است
# اگر flavor دارید، این رو بسته به flavor تنظیم کنید
