# ═══════════════════════════════════════════════════════════════════════
# android/gradle.properties
# مشاور هوشمند تحصیلی — سیمرغ
#
# پیکربندی پایه برای:
# - Gradle Wrapper 8.11.1
# - Android Gradle Plugin 8.9.1، مطابق settings.gradle پیشنهادی
# - اجرای Gradle با JDK 17
# - پروژه Flutter با AndroidX
#
# این فایل نسخه Java، Kotlin یا AGP را تعیین نمی‌کند.
# سازگاری نهایی باید با نسخه واقعی Flutter و افزونه‌ها آزمایش شود.
#
# کامنت‌های # در فایل properties معتبر هستند.
# خطوط دارای \ در انتها، ادامه یک property محسوب می‌شوند.
# بعد از \ انتهای خط، فاصله یا کامنت اضافه نکنید.
# ═══════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────
# ۱. تنظیم JVM اجراکننده Gradle
# ───────────────────────────────────────────────────────────────────────

# سقف heap برای Gradle Daemon: سه گیگابایت.
# سقف metaspace: یک گیگابایت.
#
# این مقادیر سقف حافظه کل build نیستند:
# Kotlin Daemon، workerها، ابزارهای Android و فرایندهای Flutter
# ممکن است جداگانه حافظه مصرف کنند.
#
# مناسب‌بودن این مقادیر به RAM آزاد و اندازه پروژه بستگی دارد.
# در دستگاه‌های کم‌حافظه، heap و تعداد workerها را کاهش دهید.

org.gradle.jvmargs=-Xmx3G \
  -XX:MaxMetaspaceSize=1G \
  -XX:+UseG1GC \
  -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8

# مسیر Heap Dump عمداً مشخص نشده است.
# JVM در صورت امکان از محل پیش‌فرض خود استفاده می‌کند.
#
# ${user.home} در این فایل به‌صورت خودکار جای‌گذاری نمی‌شود.
# اگر مسیر اختصاصی لازم است، پوشه را از قبل ایجاد کنید و
# -XX:HeapDumpPath را با مسیر واقعی به org.gradle.jvmargs اضافه کنید.
#
# Heap Dump ممکن است حجیم و دارای اطلاعات حساس باشد.
# آن را در Git ثبت یا بدون بررسی منتشر نکنید.


# ───────────────────────────────────────────────────────────────────────
# ۲. موازی‌سازی و Gradle Daemon
# ───────────────────────────────────────────────────────────────────────

# سقف workerهای Gradle.
# تعداد بیشتر الزاماً باعث build سریع‌تر نمی‌شود.
# برای RAM محدود، مقدار 2 نقطه شروع محافظه‌کارانه‌تری است.
org.gradle.workers.max=4

# اجرای موازی پروژه‌های مستقل، در صورت امکان.
# در صورت بروز مشکل در افزونه‌های قدیمی، با false مقایسه کنید.
org.gradle.parallel=true

# استفاده مجدد از فرایند Gradle برای buildهای بعدی.
# این گزینه تضمین نمی‌کند daemon برای همیشه زنده بماند.
# گزینه خط فرمان --no-daemon می‌تواند آن را override کند.
org.gradle.daemon=true


# ───────────────────────────────────────────────────────────────────────
# ۳. Build Cache
# ───────────────────────────────────────────────────────────────────────

# استفاده مجدد از خروجی taskهای واجد شرایط.
# پیکربندی cache محلی در settings.gradle انجام شده است.
# این گزینه به معنی cache شدن تمام taskها نیست.
org.gradle.caching=true


# ───────────────────────────────────────────────────────────────────────
# ۴. Configuration Cache
# ───────────────────────────────────────────────────────────────────────

# نسخه پایه محافظه‌کارانه:
# ابتدا سازگاری Flutter، AGP و همه افزونه‌ها بررسی شود.
#
# برای آزمایش بدون تغییر این فایل:
# ./gradlew :app:assembleDebug --configuration-cache
#
# پس از موفقیت اجرای اول و استفاده مجدد در اجرای دوم،
# taskهای release و flavorهای واقعی پروژه نیز آزمایش شوند.
org.gradle.configuration-cache=false

# عمداً از configuration-cache.problems=warn استفاده نشده است.
# نادیده‌گرفتن مشکلات، جایگزین رفع ناسازگاری افزونه‌ها نیست.


# ───────────────────────────────────────────────────────────────────────
# ۵. AndroidX و منابع Android
# ───────────────────────────────────────────────────────────────────────

android.useAndroidX=true

# فرض: تمام وابستگی‌ها و افزونه‌ها AndroidX هستند.
# اگر dependency قدیمی مبتنی بر Android Support Library دارید،
# ابتدا ارتقا یا جایگزینی آن را بررسی کنید.
android.enableJetifier=false

# R هر ماژول فقط منابع خود آن ماژول را دربر می‌گیرد.
# کد قدیمی که منابع dependency را از R ماژول خودش می‌خواند،
# ممکن است به اصلاح import یا ارجاع نیاز داشته باشد.
android.nonTransitiveRClass=true

# شناسه منابع به‌صورت non-final تولید می‌شوند.
# کد Java قدیمی مبتنی بر switch/case روی R.id ممکن است ناسازگار باشد.
android.nonFinalResIds=true


# ───────────────────────────────────────────────────────────────────────
# ۶. Kotlin
# ───────────────────────────────────────────────────────────────────────

# قرارداد سبک کدنویسی؛ جایگزین formatter یا linter نیست.
kotlin.code.style=official

# کامپایل افزایشی Kotlin.
# ارتباطی با coroutineها یا موازی‌سازی اجرای برنامه ندارد.
kotlin.incremental=true

# تنظیم حافظه Kotlin Daemon در صورت نیاز واقعی:
# kotlin.daemon.jvmargs=-Xmx1G
#
# این گزینه در نسخه پایه فعال نشده است.
# مصرف حافظه Kotlin را جدا از Gradle بررسی کنید.


# ───────────────────────────────────────────────────────────────────────
# ۷. گزارش‌گیری
# ───────────────────────────────────────────────────────────────────────

# مقادیر متداول: quiet، warn، lifecycle، info، debug
org.gradle.logging.level=lifecycle

# برای عیب‌یابی موقت از --info یا --stacktrace استفاده کنید.
# لاگ debug ممکن است اطلاعات حساس محیط یا مخازن را آشکار کند.


# ───────────────────────────────────────────────────────────────────────
# ۸. تنظیمات مخصوص محیط
# ───────────────────────────────────────────────────────────────────────

# مسیر Java، proxy و اطلاعات احراز هویت در این فایل مشترک ثبت نشوند.
# تنظیمات شخصی را ترجیحاً در:
# ~/.gradle/gradle.properties
# یا محیط CI مدیریت کنید.
#
# نمونه اختیاری با مسیر واقعی:
# org.gradle.java.home=/absolute/path/to/jdk-17
#
# timeout اینجا با networkTimeout در gradle-wrapper.properties
# یکسان نیست؛ آن گزینه مخصوص دانلود توزیع Gradle است.


# ───────────────────────────────────────────────────────────────────────
# ۹. Flutter و Flavorها
# ───────────────────────────────────────────────────────────────────────

# برای "unique variant name" گزینه عمومی موردنیازی در این فایل نداریم.
#
# موارد زیر در android/app/build.gradle تنظیم می‌شوند:
# - namespace
# - applicationId
# - compileSdk و minSdk و targetSdk
# - productFlavors و flavorDimensions
# - signingConfigs
# - نسخه زبان Java و هدف JVM برای Kotlin
