plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ── بارگذاری تنظیمات امضا ──
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "ir.moshaver.tahsili"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "ir.moshaver.tahsili"
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // فقط معماری‌های رایج در ایران
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    // ── پیکربندی امضا ──
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()
                    && keystoreProperties["storeFile"]
                    && keystoreProperties["keyAlias"]) {
                keyAlias     = keystoreProperties["keyAlias"]
                keyPassword  = keystoreProperties["keyPassword"]
                storePassword = keystoreProperties["storePassword"]
                storeFile    = file(keystoreProperties["storeFile"])
            }
        }
    }

    buildTypes {
        release {
            // اگر key.properties هست → امضای release، وگرنه debug (فقط CI)
            def hasSigning = keystorePropertiesFile.exists()
                    && keystoreProperties["storeFile"]
            signingConfig = hasSigning
                    ? signingConfigs.release
                    : signingConfigs.debug

            // بهینه‌سازی حجم APK
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }

        debug {
            // در حالت دیباگ minify غیرفعال برای دیباگ سریع
            minifyEnabled false
            shrinkResources false
        }
    }

    // ── Lint ──
    lint {
        checkReleaseBuilds = false   // جلوگیری از شکست بیلد CI
        abortOnError = false
        disable "InvalidPackage"     // فلاتر گاهی پکیج‌های javax استفاده می‌کند
    }
}

flutter {
    source = "../.."
}
