plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    ['keyAlias', 'keyPassword', 'storePassword', 'storeFile'].each { name ->
        if (!keystoreProperties[name]?.trim()) {
            throw new GradleException("Incomplete release signing configuration: $name")
        }
    }
    if (!file(keystoreProperties['storeFile']).exists()) {
        throw new GradleException('Release keystore file is missing')
    }
}
// Only CI explicitly opts into a clearly-labelled, debug-signed test build.
def ciTestBuild = project.findProperty('ciTestBuild') == 'true'

android {
    namespace = 'ir.moshaver.tahsili'
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=kotlin.RequiresOptIn']
    }

    defaultConfig {
        applicationId = 'ir.moshaver.tahsili'
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Flag‌های build-time (با BuildConfig قابل دسترس در کد)
        buildConfigField 'String', 'APP_VERSION', "\"${flutter.versionName}\""
        buildConfigField 'int', 'VERSION_CODE', flutter.versionCode.toString()
        buildConfigField 'boolean', 'IS_CI_TEST_BUILD', ciTestBuild.toString()
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storePassword = keystoreProperties['storePassword']
                storeFile = file(keystoreProperties['storeFile'])
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
            debuggable = true
            minifyEnabled = false
            shrinkResources = false
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : (ciTestBuild ? signingConfigs.debug : null)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = true
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    bundle {
        abi { enableSplit = true }
        density { enableSplit = false }
        language { enableSplit = false }
    }

    buildFeatures {
        buildConfig = true
    }
}

flutter { source = '../..' }
