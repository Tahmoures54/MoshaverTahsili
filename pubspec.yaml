name: smart_mechanic
description: رابط سبک و سریع برای گفتگو با هوش مصنوعی مکانیک
publish_to: 'none'
version: 1.3.4+10

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2
  cafebazaar_billing: ^1.2.0

  # Local storage
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Networking
  http: ^1.2.2

  # Env config
  flutter_dotenv: ^5.2.1

  # Maps & Location

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # UI & Utilities
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.3+2
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/data/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  min_sdk_android: 24
  adaptive_icon_background: "#140C08"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

flutter_native_splash:
  color: "#140C08"
  color_dark: "#140C08"
  image: assets/branding/splash_mark.png
  android_12:
    color: "#140C08"
    icon_background_color: "#140C08"
    image: assets/branding/splash_mark.png
