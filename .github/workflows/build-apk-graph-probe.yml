name: Build workflow graph probe

on:
  push:
    branches:
      - fix/stabilize-ci-security-review
    paths:
      - .github/workflows/build-apk-graph-probe.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      production_ready: ${{ steps.config.outputs.production_ready }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - name: Probe
        id: config
        run: |
          echo "production_ready=false" >> "$GITHUB_OUTPUT"
          echo "version=1.1.2" >> "$GITHUB_OUTPUT"
          echo "top-level and first job parsed"

  android-smoke:
    needs: validate-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Probe
        run: echo "dependency graph parsed"

  publish:
    needs: [validate-and-build, android-smoke]
    if: ${{
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_candidate == 'true')
    }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Probe
        run: echo "conditional publish job parsed"
