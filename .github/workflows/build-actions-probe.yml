name: Build workflow actions probe

on:
  push:
    branches:
      - fix/stabilize-ci-security-review
    paths:
      - .github/workflows/build-actions-probe.yml

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true
      - uses: actions/upload-artifact@v7
        with:
          name: action-probe
          path: README.md
