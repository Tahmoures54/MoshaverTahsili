name: Workflow dispatch and action probe

on:
  push:
    branches:
      - fix/stabilize-ci-security-review
    paths:
      - .github/workflows/dispatch-action-probe.yml
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: 'Publish an explicitly NON-PRODUCTION test release from this ref'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "dispatch input and checkout action parsed"
