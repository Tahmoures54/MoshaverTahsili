name: Flutter checks and Android build

on:
  push:
    branches:
      - main
      - 'arena/**'
      - 'release/**'
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      publish_candidate:
        description: 'Publish an explicitly NON-PRODUCTION test release from main'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt tag releases or explicitly requested publication.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.publish_candidate) }}

defaults:
  run:
    shell: bash

env:
  CI: 'true'

  # Limit Gradle memory and parallel workers.
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # One-time, narrowly scoped formatter repair for the trusted release PR.
  # This job has write access only for this exact same-repository branch.
  format-release-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'release/prepare-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Format lib and test
        run: |
          set -euo pipefail
          dart format lib test

          if git diff --quiet -- lib test; then
            echo "Dart sources are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib test
          git commit -m "style: format lib and test Dart sources"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  validate-and-build:
    needs: format-release-branch
    if: >-
      always() &&
      (needs.format-release-branch.result == 'success' ||
       needs.format-release-branch.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    outputs:
      production_ready: ${{ steps.config.outputs.production_ready }}
      version: ${{ steps.config.outputs.version }}
      artifact_name: ${{ steps.artifact.outputs.name }}

    # Secrets are available only for:
    # - push to main
    # - push of a v* tag
    # - manual execution from main
    #
    # Protect main and v* tags with repository rulesets.
    # PRs and arena branches receive empty secret values.
    env:
      AI_API_KEY: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.AI_API_KEY || '' }}

      DEEPSEEK_API_KEY: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.DEEPSEEK_API_KEY || '' }}

      AI_API_ENDPOINT: ${{ vars.AI_API_ENDPOINT || (((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.AI_API_ENDPOINT) || '' }}

      DEEPSEEK_API_ENDPOINT: ${{ vars.DEEPSEEK_API_ENDPOINT || (((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.DEEPSEEK_API_ENDPOINT) || '' }}

      AI_MODEL: ${{ vars.AI_MODEL || (((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.AI_MODEL) || '' }}

      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || (((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.DEEPSEEK_MODEL) || '' }}

      BAZAAR_RSA_PUBLIC_KEY: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.BAZAAR_RSA_PUBLIC_KEY || '' }}

      BAZAAR_CATALOG_CONFIRMED: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && (vars.BAZAAR_CATALOG_CONFIRMED || secrets.BAZAAR_CATALOG_CONFIRMED) || '' }}

      RELEASE_KEYSTORE_BASE64: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.RELEASE_KEYSTORE_BASE64 || '' }}

      RELEASE_KEYSTORE_PASSWORD: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}

      RELEASE_KEY_ALIAS: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.RELEASE_KEY_ALIAS || '' }}

      RELEASE_KEY_PASSWORD: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.RELEASE_KEY_PASSWORD || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate publication request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual candidate publication is allowed only from main."
            exit 1
          fi

      - name: Require release tags to point to main history
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::Cannot verify origin/main."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "${GITHUB_SHA}^{commit}" \
            refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit in main history."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      # Use one Gradle cache manager, not two overlapping caches.
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Check required project files
        run: |
          set -euo pipefail

          required=(
            pubspec.yaml
            pubspec.lock
            scripts/security_check.py
            scripts/annotate_analysis.py
            scripts/build_config.py
            scripts/write_build_config.py
            scripts/write_signing_config.py
            scripts/flutter_build.py
            scripts/apk_size_report.py
            scripts/check_signer.py
          )

          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required project file is missing: $file"
              exit 1
            fi
          done

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Source and Android security checks
        run: python3 scripts/security_check.py

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: |
          set -euo pipefail
          mkdir -p build/reports

          set +e
          flutter analyze \
            --no-fatal-infos \
            --write=build/reports/analyze.txt
          result=$?
          set -e

          if [[ -f build/reports/analyze.txt ]]; then
            cat build/reports/analyze.txt
            python3 scripts/annotate_analysis.py \
              build/reports/analyze.txt
          fi

          exit "$result"

      - name: Unit and widget tests
        run: |
          set -euo pipefail
          mkdir -p build/reports

          flutter test \
            --coverage \
            --reporter expanded \
            2>&1 | tee build/reports/tests.txt

      - name: Check release configuration without exposing values
        id: config
        run: |
          set -euo pipefail
          umask 077

          config_output="$RUNNER_TEMP/android-config-output.txt"
          trap 'rm -f -- "$config_output"' EXIT

          # Expected script output:
          # production_ready=true|false
          # version=<pubspec version>
          python3 scripts/build_config.py > "$config_output"

          # Validate output before exposing it to later workflow steps.
          CONFIG_OUTPUT="$config_output" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          values = {}

          for line in Path(os.environ["CONFIG_OUTPUT"]).read_text(
              encoding="utf-8"
          ).splitlines():
              if not line.strip():
                  continue

              if "=" not in line:
                  raise SystemExit("Invalid build_config.py output format.")

              key, value = line.split("=", 1)

              if key in {"production_ready", "version"}:
                  if key in values:
                      raise SystemExit(f"Duplicate configuration output: {key}")
                  values[key] = value

          if values.get("production_ready") not in {"true", "false"}:
              raise SystemExit("production_ready must be true or false.")

          version = values.get("version", "")
          pattern = (
              r"[0-9]+\.[0-9]+\.[0-9]+"
              r"(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?"
              r"(?:\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?"
          )

          if not re.fullmatch(pattern, version):
              raise SystemExit("Invalid or unsafe pubspec version.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"production_ready={values['production_ready']}\n")
              out.write(f"version={version}\n")
          PY

          python3 scripts/build_config.py --summary \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Require matching version for release tags
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "::error::Tag must exactly match v followed by the pubspec version."
            exit 1
          fi

      - name: Require production inputs for a stable tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          PRODUCTION_READY: ${{ steps.config.outputs.production_ready }}
        run: |
          set -euo pipefail

          if [[ "$PRODUCTION_READY" != "true" ]]; then
            echo "::error::Production secrets or catalog confirmation are missing. See the safe configuration summary."
            exit 1
          fi

      - name: Build Android artifacts
        env:
          VERSION: ${{ steps.config.outputs.version }}
          PRODUCTION_READY: ${{ steps.config.outputs.production_ready }}
        run: |
          set -euo pipefail
          umask 077

          config_file="$RUNNER_TEMP/ai-build-config.json"
          keystore="android/app/upload-keystore.jks"
          properties="android/key.properties"

          cleanup() {
            rm -f -- "$properties" "$keystore" "$config_file"
          }

          trap cleanup EXIT

          mkdir -p build/reports/android build/installable

          python3 scripts/write_build_config.py "$config_file"
          chmod 600 "$config_file"

          signing=(-PciTestBuild=true)

          signing_count=0
          for name in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_KEYSTORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD
          do
            if [[ -n "${!name}" ]]; then
              signing_count=$((signing_count + 1))
            fi
          done

          if [[ "$signing_count" -ne 0 && "$signing_count" -ne 4 ]]; then
            echo "::error::Incomplete signing configuration. All four signing secrets must be provided together."
            exit 1
          fi

          if [[ "$PRODUCTION_READY" == "true" &&
                "$signing_count" -ne 4 ]]; then
            echo "::error::Production build requires the existing release signing identity."
            exit 1
          fi

          if [[ "$signing_count" -eq 4 ]]; then
            mkdir -p android/app

            if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" |
              base64 --decode > "$keystore"; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is invalid."
              exit 1
            fi

            if [[ ! -s "$keystore" ]]; then
              echo "::error::Decoded release keystore is empty."
              exit 1
            fi

            chmod 600 "$keystore"

            if ! keytool -list \
              -keystore "$keystore" \
              -storepass:env RELEASE_KEYSTORE_PASSWORD \
              -alias "$RELEASE_KEY_ALIAS" \
              >/dev/null 2>&1; then
              echo "::error::Cannot open the existing keystore or locate its alias."
              exit 1
            fi

            if ! keytool -certreq \
              -keystore "$keystore" \
              -storepass:env RELEASE_KEYSTORE_PASSWORD \
              -alias "$RELEASE_KEY_ALIAS" \
              -keypass:env RELEASE_KEY_PASSWORD \
              -file /dev/null \
              >/dev/null 2>&1; then
              echo "::error::Cannot use the existing private key. Check the keystore type, passwords, and alias."
              exit 1
            fi

            python3 scripts/write_signing_config.py

            if [[ ! -s "$properties" ]]; then
              echo "::error::Signing configuration was not created."
              exit 1
            fi

            chmod 600 "$properties"
            signing=()
          fi

          build_with_retry() {
            local label="$1"
            shift

            local log="build/reports/android/build-${label}.txt"
            local status=1

            for attempt in 1 2 3; do
              # Remove stale evidence before every attempt.
              rm -f -- "$log"

              if python3 scripts/flutter_build.py "$@"; then
                return 0
              else
                status=$?
              fi

              if [[ "$attempt" -eq 3 ]]; then
                return "$status"
              fi

              # Retry only recognizable network/download failures.
              # "Downloading from" alone is not evidence of a failure.
              if [[ -f "$log" ]] && grep -Eq \
                'SocketTimeoutException|HTTP response code: 5[0-9]{2}|Read timed out|Connect timed out|Connection reset|Could not GET|Could not HEAD|Temporary failure in name resolution' \
                "$log"; then
                echo "::warning::Transient build/download failure; retrying ${label} after attempt ${attempt}."
                sleep $((attempt * 20))
              else
                return "$status"
              fi
            done

            return "$status"
          }

          build_with_retry apk-arm64 apk \
            --release \
            --target-platform android-arm64 \
            --dart-define-from-file="$config_file" \
            "${signing[@]}"

          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          target_apk="build/installable/MoshaverTahsili-${VERSION}-arm64.apk"

          if [[ ! -s "$source_apk" ]]; then
            echo "::error::Expected release APK was not produced."
            exit 1
          fi

          cp -- "$source_apk" "$target_apk"
          chmod 644 "$target_apk"

          python3 scripts/apk_size_report.py \
            build/installable \
            build/reports/android

          # Store checksums next to the installable files.
          (
            cd build/installable
            sha256sum -- *.apk > SHA256SUMS
          )

      - name: Verify release signature
        env:
          VERSION: ${{ steps.config.outputs.version }}
          PRODUCTION_READY: ${{ steps.config.outputs.production_ready }}
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi

          signer="$(
            find "$sdk_root/build-tools" \
              -type f \
              -name apksigner |
              sort -V |
              tail -n 1
          )"

          if [[ -z "$signer" || ! -x "$signer" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          "$signer" verify \
            --verbose \
            --print-certs \
            "build/installable/MoshaverTahsili-${VERSION}-arm64.apk" \
            > build/reports/android/signature.txt

          python3 scripts/check_signer.py \
            build/reports/android/signature.txt

      - name: Prepare artifact name
        id: artifact
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail

          echo "name=android-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"

      - name: Redact known sensitive values from text reports
        if: always()
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          names = (
              "AI_API_KEY",
              "DEEPSEEK_API_KEY",
              "RELEASE_KEYSTORE_BASE64",
              "RELEASE_KEYSTORE_PASSWORD",
              "RELEASE_KEY_PASSWORD",
          )

          replacements = set()

          for name in names:
              value = os.environ.get(name, "")
              if not value:
                  continue

              replacements.add(value)
              replacements.add(json.dumps(value, ensure_ascii=False)[1:-1])
              replacements.add(quote(value, safe=""))

              # Also redact long individual lines of multiline secrets.
              for line in value.splitlines():
                  if len(line) >= 8:
                      replacements.add(line)

          replacements = sorted(
              (value for value in replacements if value),
              key=len,
              reverse=True,
          )

          root = Path("build/reports")
          allowed_suffixes = {
              ".txt", ".log", ".md", ".json", ".xml", ".csv", ".html"
          }

          if root.exists():
              for path in root.rglob("*"):
                  if (
                      not path.is_file()
                      or path.is_symlink()
                      or path.suffix.lower() not in allowed_suffixes
                  ):
                      continue

                  text = path.read_text(encoding="utf-8", errors="replace")
                  redacted = text

                  for value in replacements:
                      redacted = redacted.replace(value, "[REDACTED]")

                  if redacted != text:
                      path.write_text(redacted, encoding="utf-8")
          PY

      - name: Publish Android size summary
        if: success()
        run: |
          set -euo pipefail

          if [[ -f build/reports/android/summary.md ]]; then
            cat build/reports/android/summary.md \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            build/installable/
            build/reports/android/summary.md
            build/reports/android/signature.txt
            pubspec.lock
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish failure diagnostics to job summary
        if: failure()
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("build/reports")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write("\n## Failure diagnostics\n")

              if not root.exists():
                  output.write("\nNo diagnostic reports were generated.\n")
              else:
                  paths = sorted(
                      path
                      for path in root.rglob("*.txt")
                      if path.is_file() and not path.is_symlink()
                  )

                  for path in paths[:10]:
                      lines = path.read_text(
                          encoding="utf-8",
                          errors="replace",
                      ).splitlines()[-100:]

                      text = "\n".join(lines)[-12000:]
                      text = text.replace("```", "` ` `")

                      output.write(f"\n### {path.name}\n\n```text\n")
                      output.write(text)
                      output.write("\n```\n")
          PY

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/lcov.info
            build/reports/**/*.txt
            build/reports/**/*.log
            build/reports/**/*.md
            build/reports/**/*.json
            build/reports/**/*.xml
            build/reports/**/*.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean temporary signing and build configuration files
        if: always()
        run: |
          set -euo pipefail

          rm -f -- \
            android/key.properties \
            android/app/upload-keystore.jks \
            "$RUNNER_TEMP/ai-build-config.json" \
            "$RUNNER_TEMP/android-config-output.txt"

  android-smoke:
    needs:
      - validate-and-build

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check smoke-test scripts
        run: |
          set -euo pipefail

          for file in \
            scripts/android_smoke.sh \
            scripts/annotate_log.py
          do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required smoke-test script is missing: $file"
              exit 1
            fi
          done

      - name: Enable emulator acceleration
        run: |
          set -euo pipefail

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          if [[ ! -e /dev/kvm ]]; then
            echo "::error::KVM acceleration is unavailable."
            exit 1
          fi

      # This tests a temporary debug build.
      # It does not install or test the arm64 release APK.
      - name: Smoke-test app on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
          script: bash scripts/android_smoke.sh

      - name: Annotate Android smoke failure
        if: failure()
        run: |
          set -euo pipefail

          logs=()

          for file in \
            build/reports/device/app-integration.txt \
            build/reports/device/secure-storage-integration.txt \
            build/reports/device/install.txt \
            build/reports/device/launch.txt \
            build/reports/device/crash-log.txt
          do
            if [[ -f "$file" ]]; then
              logs+=("$file")
            fi
          done

          if [[ "${#logs[@]}" -gt 0 &&
                -f scripts/annotate_log.py ]]; then
            python3 scripts/annotate_log.py "${logs[@]}"
          else
            echo "::warning::No Android smoke diagnostic logs are available."
          fi

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/device/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs:
      - validate-and-build
      - android-smoke

    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish_candidate &&
       github.ref == 'refs/heads/main')

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validate-and-build.outputs.artifact_name }}
          path: release-files

      - name: Validate release assets
        run: |
          set -euo pipefail

          # The upload paths have the repository root as their common
          # ancestor, so build/installable is preserved after download.
          installable="release-files/build/installable"

          if [[ ! -d "$installable" ]]; then
            echo "::error::Downloaded artifact does not contain build/installable."
            exit 1
          fi

          mapfile -d '' -t apks < <(
            find "$installable" \
              -maxdepth 1 \
              -type f \
              -name '*-arm64.apk' \
              -print0
          )

          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one arm64 APK."
            exit 1
          fi

          if [[ ! -s "$installable/SHA256SUMS" ]]; then
            echo "::error::APK checksum file is missing."
            exit 1
          fi

          (
            cd "$installable"
            sha256sum -c SHA256SUMS
          )

      - name: Publish honestly labelled release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-and-build.outputs.version }}
          READY: ${{ needs.validate-and-build.outputs.production_ready }}
        run: |
          set -euo pipefail

          installable="release-files/build/installable"

          mapfile -d '' -t files < <(
            find "$installable" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0
          )

          files+=("$installable/SHA256SUMS")

          # Attach only selected public reports, not raw build logs.
          for report in \
            release-files/build/reports/android/summary.md \
            release-files/build/reports/android/signature.txt \
            release-files/pubspec.lock
          do
            if [[ -f "$report" ]]; then
              files+=("$report")
            fi
          done

          stable=false

          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"

            if [[ "$tag" != "v${VERSION}" ]]; then
              echo "::error::Tag and application version do not match."
              exit 1
            fi

            if [[ "$tag" != *-* ]]; then
              if [[ "$READY" != "true" ]]; then
                echo "::error::A stable release requires production_ready=true."
                exit 1
              fi

              stable=true
            fi
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual publication is allowed only from main."
              exit 1
            fi

            tag="v${VERSION}-test.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          # Do not silently replace assets of an existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A release already exists for this tag. Existing releases are not overwritten."
            exit 1
          fi

          notes_file="$RUNNER_TEMP/android-release-notes.md"
          trap 'rm -f -- "$notes_file"' EXIT

          if [[ "$stable" == "true" ]]; then
            cat > "$notes_file" <<'TXT'
          ## نسخه انتشار

          - پیکربندی تولید و تأیید کاتالوگ طبق کنترل‌های خودکار پروژه بررسی شده‌اند.
          - APK با هویت امضای موجود ساخته شده و بررسی امضا انجام شده است.
          - بررسی ایستا، آزمون‌های unit/widget و smoke test اندروید موفق بوده‌اند.
          - smoke test روی ساخت debug موقت اجرا شده است، نه روی APK انتشار پیوست.
          - فایل SHA256SUMS و گزارش امضا در پیوست قرار دارند.

          آزمون پرداخت واقعی، ارتباط واقعی سرویس‌ها و نصب APK انتشار روی گوشی باید جداگانه انجام و در پرونده انتشار ثبت شوند. موفقیت CI به‌تنهایی تأییدکننده این موارد نیست.
          TXT

            gh release create "$tag" "${files[@]}" \
              --verify-tag \
              --latest \
              --title "سیمرغ $VERSION" \
              --notes-file "$notes_file"
          else
            cat > "$notes_file" <<'TXT'
          ## NON-PRODUCTION — نسخه آزمایشی

          این نسخه فقط برای نصب و آزمون است و تأیید انتشار تجاری ندارد.

          - ممکن است با کلید debug امضا شده باشد.
          - ممکن است پیکربندی AI یا تأیید کاتالوگ بازار را نداشته باشد.
          - موفقیت CI به معنای تأیید پرداخت واقعی یا ارتباط واقعی سرویس‌ها نیست.
          - smoke test روی ساخت debug موقت اجرا شده است، نه روی APK انتشار پیوست.
          - نصب APK پیوست و آزمون آن روی گوشی باید جداگانه انجام شود.
          - فایل SHA256SUMS و گزارش‌های منتخب در پیوست قرار دارند.

          این نسخه را جایگزین نسخه تولید نکنید.
          TXT

            if [[ "$GITHUB_EVENT_NAME" == "push" &&
                  "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release create "$tag" "${files[@]}" \
                --verify-tag \
                --prerelease \
                --latest=false \
                --title "NON-PRODUCTION — نسخه آزمایشی $VERSION" \
                --notes-file "$notes_file"
            else
              gh release create "$tag" "${files[@]}" \
                --target "$GITHUB_SHA" \
                --prerelease \
                --latest=false \
                --title "NON-PRODUCTION — نسخه آزمایشی $VERSION (ساخت $GITHUB_RUN_NUMBER)" \
                --notes-file "$notes_file"
            fi
          fi

          {
            echo "## Android release published"
            echo
            printf -- '- Tag: `%s`\n' "$tag"
            printf -- '- Production release: `%s`\n' "$stable"
            echo "- APK checksum verification passed."
            echo "- Existing release assets were not overwritten."
          } >> "$GITHUB_STEP_SUMMARY"
