name: Build Flutter APK

permissions:
  contents: write

on:
  push:
    branches: [ main, cafe-bazaar ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, cafe-bazaar ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'ساخت APK مستقیم، Android App Bundle یا هر دو'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - appbundle

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Ensure .env for assets (production API)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          Path(".env").write_text(
              "API_BASE_URL=https://smart-mec.ir/api\n"
              "API_VERSION=\n",
              encoding="utf-8",
          )
          print("API_BASE_URL set to production smart-mec.ir")
          PY
      - name: Flutter pub get
        run: flutter pub get

      - name: Clean previous builds
        run: flutter clean && flutter pub get

      - name: Ensure Gradle wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          chmod +x android/gradlew || true
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          cat analyze.log
          if grep -Eq '(^|[[:space:]])error •|(^|[[:space:]])Error:' analyze.log; then
            exit 1
          fi
          exit 0

      - name: Test
        run: flutter test

      - name: Generate branding + launcher icons
        run: |
          pip3 install --quiet pillow
          python3 tool/generate_branding.py
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          res = Path("android/app/src/main/res")
          copied = 0
          for folder in sorted(res.glob("mipmap-*")):
              for name in ("ic_launcher.png", "ic_launcher.xml"):
                  src = folder / name
                  dst = folder / name.replace("ic_launcher", "ic_launcher_round", 1)
                  if src.exists() and not dst.exists():
                      dst.write_bytes(src.read_bytes())
                      copied += 1
                      print(f"copied {src} -> {dst}")
          print(f"round-icon fallbacks created: {copied}")
          PY
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      # تعمیرگاه‌ها از دیتابیس خود اپ می‌آیند — کلید Google Maps الزامی نیست
      - name: Optional Google Maps key (not required)
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_KEY" ]; then
            echo "بدون GOOGLE_MAPS_API_KEY — تعمیرگاه‌ها از API خودمان بارگذاری می‌شوند."
            exit 0
          fi
          python3 -c '
          import os, re
          path = "android/app/src/main/AndroidManifest.xml"
          key = os.environ["MAPS_KEY"]
          text = open(path, encoding="utf-8").read()
          pattern = r"(android:name=\"com\.google\.android\.geo\.API_KEY\"\s+android:value=\")[^\"]*(\")"
          text2, n = re.subn(pattern, rf"\g<1>{key}\2", text)
          if n != 1:
              raise SystemExit(f"Expected exactly one Maps API key placeholder, found {n}")
          open(path, "w", encoding="utf-8").write(text2)
          print("Optional Maps API key injected")
          '

      - name: Setup release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::برای انتشار نسخه امضاشده باید ۴ تا Secret کلید را ست کنید (بدون Google Maps)."
              echo "Actions → Generate Android Release Key → بعد Secrets را پر کنید."
              exit 1
            fi
            echo "::warning::بدون keystore — امضای debug (فقط CI). برای انتشار مناسب نیست."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=${RELEASE_KEYSTORE_PASSWORD}" \
            "keyPassword=${RELEASE_KEY_PASSWORD}" \
            "keyAlias=${RELEASE_KEY_ALIAS}" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties
          echo "✅ Release signing configured"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Validate release-only secrets
        if: ${{ github.event_name != 'pull_request' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_ENDPOINT: https://api.avalai.ir/v1/chat/completions
          AI_MODEL: deepseek-chat
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::error::برای عیب‌یابی مستقیم، Secret با نام AI_API_KEY را تنظیم کنید."
            exit 1
          fi
          if [ -z "$BAZAAR_RSA_PUBLIC_KEY" ]; then
            echo "::error::کلید عمومی پرداخت بازار را در Secret با نام BAZAAR_RSA_PUBLIC_KEY تنظیم کنید."
            exit 1
          fi

      - name: Build arm64 APK (Cafe Bazaar)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_ENDPOINT: https://api.avalai.ir/v1/chat/completions
          AI_MODEL: deepseek-chat
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        run: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols \
            --dart-define="AI_API_KEY=$AI_API_KEY" \
            --dart-define="AI_API_ENDPOINT=$AI_API_ENDPOINT" \
            --dart-define="AI_MODEL=$AI_MODEL" \
            --dart-define="BAZAAR_RSA_PUBLIC_KEY=$BAZAAR_RSA_PUBLIC_KEY"

      - name: Build App Bundle
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type != 'apk' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_ENDPOINT: https://api.avalai.ir/v1/chat/completions
          AI_MODEL: deepseek-chat
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        run: |
          flutter build appbundle --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols \
            --dart-define="AI_API_KEY=$AI_API_KEY" \
            --dart-define="AI_API_ENDPOINT=$AI_API_ENDPOINT" \
            --dart-define="AI_MODEL=$AI_MODEL" \
            --dart-define="BAZAAR_RSA_PUBLIC_KEY=$BAZAAR_RSA_PUBLIC_KEY"

      - name: Verify APK signature + prepare direct release package
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle') }}
        env:
          HAS_KS: ${{ env.HAS_KEYSTORE }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

          if [ "$HAS_KS" = "true" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            if [ -z "$APKSIGNER" ]; then
              echo "::error::Android apksigner tool not found."
              exit 1
            fi
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            mkdir -p direct-apk-release
            cp "$APK" direct-apk-release/app-release.apk
            echo "✅ Signed APK verified and prepared for direct release"
          else
            echo "::warning::APK با debug امضا شده — برای انتشار مستقیم مناسب نیست."
          fi

      - name: Upload APK artifact
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload direct APK release package
        if: ${{ env.HAS_KEYSTORE == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle') }}
        uses: actions/upload-artifact@v4
        with:
          name: direct-apk-release
          path: direct-apk-release/
          if-no-files-found: error
          retention-days: 30

      # A public, stable download page is created only for an explicit v* release tag.
      - name: Publish signed APK to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle') }}
        uses: softprops/action-gh-release@v2
        with:
          name: "مکانیک هوشمند ${{ github.ref_name }}"
          body: |
            نسخه اندروید مکانیک هوشمند.

            فایل APK فقط پس از بررسی امضای نسخه در همین انتشار قرار می‌گیرد.
            کاربران می‌توانند از صفحه انتشارهای رسمی پروژه نسخه را دریافت کنند.
          files: direct-apk-release/app-release.apk
          draft: false
          prerelease: false

      - name: Upload App Bundle
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type != 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## خروجی بیلد"
            echo ""
            if [ "${{ env.HAS_KEYSTORE }}" = "true" ]; then
              echo "✅ امضای release فعال بود."
              echo ""
              echo "### بسته انتشار مستقیم"
              echo "1. Artifact **direct-apk-release** را دانلود کنید"
              echo "2. فایل **app-release.apk** را در محل انتشار اپلیکیشن آپلود کنید"
            else
              echo "⚠️ بدون keystore — برای انتشار مستقیم باید کلید بسازید:"
              echo "1. Actions → Generate Android Release Key"
              echo "2. Settings → Secrets: چهار مقدار RELEASE_KEYSTORE_* و RELEASE_KEY_ALIAS"
              echo "3. دوباره Build Flutter APK → Run workflow"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
