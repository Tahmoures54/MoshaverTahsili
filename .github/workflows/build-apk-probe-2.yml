name: Build workflow probe 2

on:
  push:
    branches:
      - fix/stabilize-ci-security-review
    paths:
      - .github/workflows/build-apk-probe-2.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe 2 started"
