name: Generate Android signing key

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE_AND_STORE to generate the key and save it directly as Actions secrets"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-signing-key-generation
  cancel-in-progress: false

jobs:
  generate-and-store:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'CREATE_AND_STORE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate bootstrap token and prevent key replacement
        env:
          BOOTSTRAP_TOKEN: \${{ secrets.GH_SECRETS_BOOTSTRAP_TOKEN }}
          EXISTING_KEYSTORE: \${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          EXISTING_ALIAS: \${{ secrets.RELEASE_KEY_ALIAS }}
          EXISTING_STORE_PASSWORD: \${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          EXISTING_KEY_PASSWORD: \${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BOOTSTRAP_TOKEN" ]]; then
            echo "::error::Add a temporary fine-grained PAT as GH_SECRETS_BOOTSTRAP_TOKEN. It needs Actions: Read and write for this repository."
            exit 1
          fi
          if [[ -n "$EXISTING_KEYSTORE$EXISTING_ALIAS$EXISTING_STORE_PASSWORD$EXISTING_KEY_PASSWORD" ]]; then
            echo "::error::At least one release signing secret already exists. Refusing to overwrite signing identity."
            exit 1
          fi
          echo "Preconditions passed."

      - name: Generate keystore on GitHub runner
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/moshaver-signing"
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="moshaver-tahsili-upload"
          KEYSTORE="$RUNNER_TEMP/moshaver-signing/upload-keystore.jks"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Moshaver Tahsili, OU=Android, O=Tahmoures54, L=Unknown, ST=Unknown, C=IR"

          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEYSTORE_BASE64=$(base64 -w 0 "$KEYSTORE")"
          } >> "$GITHUB_OUTPUT"

          echo "Keystore generated and validated in the ephemeral GitHub runner."

      - name: Store signing values directly as GitHub Actions secrets
        env:
          GH_TOKEN: \${{ secrets.GH_SECRETS_BOOTSTRAP_TOKEN }}
          OWNER: \${{ github.repository_owner }}
          REPO: \${{ github.event.repository.name }}
          STORE_PASSWORD: \${{ steps.generate.outputs.STORE_PASSWORD }}
          KEY_PASSWORD: \${{ steps.generate.outputs.KEY_PASSWORD }}
          KEY_ALIAS: \${{ steps.generate.outputs.KEY_ALIAS }}
          KEYSTORE_BASE64: \${{ steps.generate.outputs.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyNaCl
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from nacl.public import PublicKey, SealedBox

          owner = os.environ["OWNER"]
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{owner}/{repo}/actions/secrets"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  raise RuntimeError(f"GitHub API returned HTTP {exc.code}: {detail[:500]}") from exc

          _, key_data = request(base + "/public-key")
          public_key = PublicKey(base64.b64decode(key_data["key"]))
          sealed_box = SealedBox(public_key)

          values = {
              "RELEASE_KEYSTORE_BASE64": os.environ["KEYSTORE_BASE64"],
              "RELEASE_KEYSTORE_PASSWORD": os.environ["STORE_PASSWORD"],
              "RELEASE_KEY_ALIAS": os.environ["KEY_ALIAS"],
              "RELEASE_KEY_PASSWORD": os.environ["KEY_PASSWORD"],
          }

          for name, value in values.items():
              encrypted = base64.b64encode(sealed_box.encrypt(value.encode())).decode()
              request(f"{base}/{name}", "PUT", {
                  "encrypted_value": encrypted,
                  "key_id": key_data["key_id"],
              })
              print(f"Stored Actions secret: {name}")

          # Remove the temporary bootstrap credential from repository secrets.
          request(base + "/GH_SECRETS_BOOTSTRAP_TOKEN", "DELETE")
          print("Removed temporary GH_SECRETS_BOOTSTRAP_TOKEN repository secret.")
          PY

      - name: Verify signing configuration and clean temporary files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/moshaver-signing"
          echo "Runner-local keystore files cleaned. GitHub-hosted runner will be discarded."

      - name: Publish completion summary
        run: |
          {
            echo "## Android signing key generated and stored"
            echo
            echo "- The keystore was generated inside this ephemeral GitHub Actions runner."
            echo "- Four RELEASE_* values were saved directly as repository Actions secrets."
            echo "- No keystore, password file, plaintext artifact, or encrypted artifact was uploaded."
            echo "- The temporary GH_SECRETS_BOOTSTRAP_TOKEN repository secret was deleted."
            echo "- Revoke the fine-grained PAT in GitHub Settings > Developer settings > Personal access tokens."
            echo "- Keep a separate secure offline backup of the signing key before publishing updates."
          } >> "$GITHUB_STEP_SUMMARY"
