name: Generate Android signing key

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE_AND_STORE to generate the key and save it directly as Actions secrets"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-signing-key-generation
  cancel-in-progress: false

jobs:
  generate-and-store:
    # استفاده از github.event.inputs به‌جای inputs برای اطمینان از دسترسی در job-level if
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm == 'CREATE_AND_STORE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Validate bootstrap token and prevent key replacement
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.GH_SECRETS_BOOTSTRAP_TOKEN }}
          EXISTING_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          EXISTING_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          EXISTING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          EXISTING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BOOTSTRAP_TOKEN:-}" ]]; then
            echo "::error::Add a temporary fine-grained PAT as GH_SECRETS_BOOTSTRAP_TOKEN."
            echo "The token needs repository permission: Secrets — Read and write."
            exit 1
          fi

          if [[ -n "${EXISTING_KEYSTORE}${EXISTING_ALIAS}${EXISTING_STORE_PASSWORD}${EXISTING_KEY_PASSWORD}" ]]; then
            echo "::error::At least one release signing secret already exists. Refusing to overwrite signing identity."
            exit 1
          fi

          echo "Preconditions passed."

      - name: Generate keystore on GitHub runner
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          work="$RUNNER_TEMP/moshaver-signing"
          mkdir -p "$work"

          # trap پیش از هرگونه نوشتن داده حساس ثبت می‌شود
          trap 'rm -rf "$work"' EXIT

          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="moshaver-tahsili-upload"
          KEYSTORE="$work/upload-keystore.jks"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Moshaver Tahsili, OU=Android, O=Tahmoures54, L=Unknown, ST=Unknown, C=IR"

          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          # نوشتن مقادیر در GITHUB_OUTPUT به‌صورت multiline برای base64 طولانی
          {
            echo "STORE_PASSWORD<<EOF_STORE"
            echo "$STORE_PASSWORD"
            echo "EOF_STORE"
            echo "KEY_PASSWORD<<EOF_KEY"
            echo "$KEY_PASSWORD"
            echo "EOF_KEY"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEYSTORE_BASE64<<EOF_B64"
            base64 -w 0 "$KEYSTORE"
            echo ""
            echo "EOF_B64"
          } >> "$GITHUB_OUTPUT"

          echo "Keystore generated and validated in the ephemeral GitHub runner."

      - name: Store signing values as GitHub Actions secrets (via gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_BOOTSTRAP_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORE_PASSWORD: ${{ steps.generate.outputs.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ steps.generate.outputs.KEY_PASSWORD }}
          KEY_ALIAS: ${{ steps.generate.outputs.KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ steps.generate.outputs.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          # gh secret set رمزنگاری را به‌صورت محلی انجام می‌دهد؛ نیازی به PyNaCl نیست.
          # --body در argv قرار می‌گیرد؛ برای کاهش قرارگیری در فرآیند، از stdin استفاده می‌کنیم.
          printf '%s' "$KEYSTORE_BASE64" | gh secret set RELEASE_KEYSTORE_BASE64
          printf '%s' "$STORE_PASSWORD" | gh secret set RELEASE_KEYSTORE_PASSWORD
          printf '%s' "$KEY_ALIAS"      | gh secret set RELEASE_KEY_ALIAS
          printf '%s' "$KEY_PASSWORD"   | gh secret set RELEASE_KEY_PASSWORD

          echo "Stored four RELEASE_* secrets."

      - name: Remove temporary bootstrap token secret
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_BOOTSTRAP_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # حذف secret نیازمند مجوز Secrets: Write است (نه Administration).
          if gh secret delete GH_SECRETS_BOOTSTRAP_TOKEN --yes 2>/dev/null; then
            echo "Removed temporary GH_SECRETS_BOOTSTRAP_TOKEN repository secret."
          else
            echo "::warning::Could not delete GH_SECRETS_BOOTSTRAP_TOKEN automatically."
            echo "Delete it manually in Settings → Secrets and variables → Actions,"
            echo "then revoke the fine-grained PAT in Developer settings."
          fi

      - name: Verify signing configuration and clean temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/moshaver-signing"
          echo "Runner-local keystore files cleaned. GitHub-hosted runner will be discarded."

      - name: Publish completion summary
        run: |
          {
            echo "## Android signing key generated and stored"
            echo
            echo "- The keystore was generated inside this ephemeral GitHub Actions runner."
            echo "- Four RELEASE_* values were saved directly as repository Actions secrets."
            echo "- No keystore, password file, plaintext artifact, or encrypted artifact was uploaded."
            echo "- The temporary GH_SECRETS_BOOTSTRAP_TOKEN repository secret was deleted automatically."
            echo "- Revoke the fine-grained PAT in GitHub Settings → Developer settings → Personal access tokens."
            echo "- Keep a separate secure offline backup of the signing key before publishing updates."
          } >> "$GITHUB_STEP_SUMMARY"
