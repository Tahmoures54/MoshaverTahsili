name: Build workflow probe 7

on:
  push:
    branches:
      - fix/stabilize-ci-security-review
    paths:
      - .github/workflows/build-apk-probe-7.yml

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - name: Config environment probe
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_API_ENDPOINT: ${{ vars.AI_API_ENDPOINT || secrets.AI_API_ENDPOINT }}
          DEEPSEEK_API_ENDPOINT: ${{ vars.DEEPSEEK_API_ENDPOINT || secrets.DEEPSEEK_API_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL || secrets.AI_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || secrets.DEEPSEEK_MODEL }}
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
          BAZAAR_CATALOG_CONFIRMED: ${{ vars.BAZAAR_CATALOG_CONFIRMED || secrets.BAZAAR_CATALOG_CONFIRMED }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: echo "env expressions parsed"
      - name: Conditional step probe
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        run: echo "step condition parsed"
