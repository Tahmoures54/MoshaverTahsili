name: Build workflow probe 4

on:
  push:
    branches:
      - fix/stabilize-ci-security-review
    paths:
      - .github/workflows/build-apk-probe-4.yml

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    outputs:
      version: "${{ steps.config.outputs.version }}"
    steps:
      - name: Probe output
        id: config
        run: echo "version=1.1.2" >> "$GITHUB_OUTPUT"
