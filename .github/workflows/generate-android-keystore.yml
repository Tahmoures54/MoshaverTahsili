name: Generate Android release keystore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE to generate the app's permanent release signing key"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-keystore:
    if: inputs.confirm == 'CREATE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate bootstrap password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_PASSWORD" || ${#KEYSTORE_PASSWORD} -lt 16 ]]; then
            echo "::error::Create repository secret KEYSTORE_BOOTSTRAP_PASSWORD with at least 16 characters before running this workflow."
            exit 1
          fi

      - name: Generate permanent JKS signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p output
          keytool -genkeypair -noprompt \
            -keystore output/moshaver-release.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MoshaverTahsili, OU=Android, O=MoshaverTahsili, C=IR"
          keytool -list -v \
            -keystore output/moshaver-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias upload > output/certificate-info.txt
          chmod 600 output/moshaver-release.jks
          {
            echo "## Android release key generated"
            echo ""
            echo "- Alias: `upload`"
            echo "- Store type: JKS"
            echo "- Validity: 10,000 days"
            echo "- The keystore is password-protected using the repository secret `KEYSTORE_BOOTSTRAP_PASSWORD`."
            echo "- Download the artifact and keep at least two secure backups."
            echo "- Do not run this workflow again after saving the key. A second run creates a different key and will break updates signed with the first key."
            echo ""
            echo "Certificate fingerprint:"
            grep -E 'SHA256:' output/certificate-info.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload password-protected keystore
        uses: actions/upload-artifact@v7
        with:
          name: moshaver-android-release-keystore
          path: output/moshaver-release.jks
          if-no-files-found: error
          retention-days: 7
