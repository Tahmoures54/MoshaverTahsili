name: Generate Android Release Key (One-Time)

# این workflow را فقط برای ساخت اولین کلید انتشار اجرا کنید.
# اگر اپ قبلاً با کلید دیگری منتشر شده، همان کلید را حفظ کنید.

on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android release keystore
        run: |
          set -euo pipefail
          mkdir -p out
          STORE_PASS="$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-28)"
          KEY_ALIAS="upload"
          KEYSTORE="out/android-release-upload.jks"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=Smart Mechanic, OU=Android, O=Smart Mec, L=Tehran, ST=Tehran, C=IR"

          base64 -w0 "$KEYSTORE" > out/RELEASE_KEYSTORE.base64
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > out/certificate-info.txt
          grep -E 'SHA1:|SHA256:|Owner:|Valid' out/certificate-info.txt > out/fingerprints.txt || true

          printf '%s\n' \
            "RELEASE_KEY_ALIAS=$KEY_ALIAS" \
            "RELEASE_KEYSTORE_PASSWORD=$STORE_PASS" \
            "RELEASE_KEY_PASSWORD=$STORE_PASS" \
            > out/github-secrets.txt

          printf '%s\n' \
            'در GitHub → Settings → Secrets and variables → Actions این چهار مقدار را ذخیره کنید:' \
            'RELEASE_KEYSTORE_BASE64 ← فایل RELEASE_KEYSTORE.base64' \
            'RELEASE_KEYSTORE_PASSWORD و RELEASE_KEY_PASSWORD ← فایل github-secrets.txt' \
            'RELEASE_KEY_ALIAS=upload' \
            '' \
            'فایل JKS را آفلاین و در محل امن نگه دارید. برای به‌روزرسانی همان کلید لازم است.' \
            > out/README.txt

          ls -lh out/
          cat out/fingerprints.txt

      - name: Upload signing kit
        uses: actions/upload-artifact@v4
        with:
          name: android-release-key
          path: out/
          if-no-files-found: error
          retention-days: 7
