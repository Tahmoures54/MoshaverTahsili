name: Build workflow probe 5

on:
  push:
    branches:
      - fix/stabilize-ci-security-review
    paths:
      - .github/workflows/build-apk-probe-5.yml

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
    steps:
      - id: config
        run: echo "version=1.1.2" >> "$GITHUB_OUTPUT"

  android-smoke:
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - run: echo "smoke"

  publish:
    needs: [validate-and-build, android-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: echo "publish"
