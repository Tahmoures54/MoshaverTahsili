
# Static analysis configuration for Simorgh
# Flutter SDK: 3.35.7 (pinned in .fvmrc)
#
# Base rules: official Flutter lint rules.
# Additional rules: type safety, resource management and maintainability.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated and build files
    - build/**
    - .dart_tool/**
    - coverage/**
    - lib/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

  errors:
    # Critical analyzer diagnostics
    missing_return: error

    # Keep these visible without making every existing warning
    # an immediate CI-breaking error.
    dead_code: warning
    unused_import: warning
    unused_local_variable: warning

  language:
    # Prevent unsafe implicit conversions and weak type inference.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ---------------------------------------------------------
    # Type safety and correctness
    # ---------------------------------------------------------
    - avoid_dynamic_calls
    - avoid_types_as_parameter_names
    - await_only_futures
    - collection_methods_unrelated_type
    - no_duplicate_case_values
    - test_types_in_equals
    - type_annotate_public_apis

    # ---------------------------------------------------------
    # Async programming and resource management
    # ---------------------------------------------------------
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - unawaited_futures
    - avoid_slow_async_io
    - throw_in_finally

    # ---------------------------------------------------------
    # Flutter and widget quality
    # ---------------------------------------------------------
    - avoid_print
    - avoid_unnecessary_containers
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_locals
    - sized_box_for_whitespace
    - sort_child_properties_last
    - use_build_context_synchronously
    - use_key_in_widget_constructors
    - use_super_parameters

    # ---------------------------------------------------------
    # Code readability and consistency
    # ---------------------------------------------------------
    - always_declare_return_types
    - directives_ordering
    - prefer_single_quotes
    - prefer_interpolation_to_compose_strings
    - unnecessary_lambdas
    - avoid_redundant_argument_values
    - require_trailing_commas
    - curly_braces_in_flow_control_structures
    - avoid_empty_else
    - prefer_is_empty
    - prefer_is_not_empty

    # ---------------------------------------------------------
    # Imports and dependencies
    # ---------------------------------------------------------
    - prefer_relative_imports
    - depend_on_referenced_packages
    - sort_pub_dependencies

    # ---------------------------------------------------------
    # Maintainability
    # ---------------------------------------------------------
    - avoid_unused_constructor_parameters
    - avoid_void_async
    - avoid_catching_errors
    - avoid_catches_without_on_clauses
    - unnecessary_async
    - unnecessary_await_in_return
    - unnecessary_null_checks
    - unnecessary_nullable_for_final_variable_declarations
